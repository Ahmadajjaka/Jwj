
name: Build Mamo Accounting APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK (Firebase Ready)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore project debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Missing DEBUG_KEYSTORE_BASE64"
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Configure optional API key
        env:
          GROQ_SECRET: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -n "$GROQ_SECRET" ]; then
            printf 'GROQ_API_KEY=%s\n' "$GROQ_SECRET" > .env
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Mamo Accounting APK
        uses: actions/upload-artifact@v4
        with:
          name: MamoAccounting-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
